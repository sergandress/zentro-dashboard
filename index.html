        * { margin: 0; padding: 0; box-sizing: border-box; }

        .header h1 { font-size: 22px; font-weight: 800; }
        .header h1 span { color: #10b981; }
        .tabs { background: #0d1526; border-bottom: 1px solid #1e293b; padding: 0 24px; display: flex; gap: 4px; }

        .content { padding: 24px; max-width: 1000px; margin: 0 auto; }

        .stat-box { background: #0d1526; border: 1px solid #1e293b; border-radius: 12px; padding: 20px 24px; }
        .stat-label { font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .stat-value { font-size: 30px; font-weight: 800; }
        .table-container { background: #0d1526; border: 1px solid #1e293b; border-radius: 12px; overflow: hidden; }
        table { width: 100%; border-collapse: collapse; }
        thead { background: #1e293b; }
        th { padding: 12px 16px; text-align: left; font-size: 11px; font-weight: 700; color: #94a3b8; }
        td { padding: 13px 16px; font-size: 13px; border-top: 1px solid #1e293b; }
        .status-badge { padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
        .badge-confirmed { background: #064e3b; color: #10b981; }
        .badge-pending { background: #78350f; color: #fbbf24; }
        .badge-paid { background: #1e3a5f; color: #60a5fa; }

        .btn { padding: 8px 14px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; cursor: pointer; font-size: 13px; }
        .btn-primary { background: #10b981; border: none; font-weight: 600; }
        .btn-download { background: #10b981; border: none; font-weight: 600; }
        button { display: flex; align-items: center; gap: 6px; }
    </style>
